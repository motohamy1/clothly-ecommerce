services:
  - type: web
    name: clothly-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build && npm run seed:admin
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
